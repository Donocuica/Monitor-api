<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monitor VPS</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 20px;
}

.table-container {
  max-height: 400px;   /* 👈 altura */
  overflow-y: auto;    /* 👈 scroll */
  border: 1px solid #333;
}

table {
  width: 100%;
  background: #1e293b;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
}

th {
  background: #020617;
  position: sticky;  /* 👈 header fijo */
  top: 0;
}

button {
  padding: 6px 10px;
  margin: 2px;
  border: none;
  cursor: pointer;
}

.view { background: blue; color: white; }
.down { background: green; color: white; }

pre {
  background: black;
  padding: 10px;
  margin-top: 20px;
  max-height: 300px;
  overflow-y: auto;
}
</style>
</head>

<body>

<h2>📁 Archivos generados</h2>

<div class="table-container">
  <table border="1">
    <thead>
      <tr>
        <th>Archivo</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody id="tabla">
      <tr><td colspan="2">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<h2>📄 Contenido</h2>
<pre id="contenido">---</pre>

<script>
async function cargarArchivos() {
  try {
    const res = await fetch("/files");
    const files = await res.json();

    let html = "";

    if (!files.length) {
      html = "<tr><td colspan='2'>No hay archivos</td></tr>";
    } else {
      files.forEach(f => {
        html += `
          <tr>
            <td>${f}</td>
            <td>
              <button class="view" onclick="ver('${f}')">Ver</button>
              <button class="down" onclick="descargar('${f}')">Descargar</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById("tabla").innerHTML = html;

  } catch (err) {
    console.error("❌ ERROR:", err);
  }
}

async function ver(file) {
  const res = await fetch("/view/" + file);
  const text = await res.text();
  document.getElementById("contenido").innerText = text;
}

function descargar(file) {
  window.open("/download/" + file);
}

setInterval(cargarArchivos, 3000);
cargarArchivos();
</script>

</body>
</html>
