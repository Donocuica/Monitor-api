<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Monitor VPS Logs</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    input {
      width: 400px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    .box {
      margin-top: 20px;
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .title {
      font-size: 18px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h2>📄 Visor de Logs VPS</h2>

  <p>Ingresa el nombre del archivo:</p>

  <input id="fileName" placeholder="monitor_2026-03-31_10001.txt">
  <button onclick="verLog()">Ver Log</button>

  <div class="box">
    <div class="title">Contenido:</div>
    <pre id="output">Esperando archivo...</pre>
  </div>

  <script>
    async function verLog() {
      const file = document.getElementById("fileName").value;

      if (!file) {
        alert("Ingresa un archivo");
        return;
      }

      try {
        const res = await fetch(`/api/log?file=${file}`);
        const text = await res.text();

        document.getElementById("output").innerHTML = text;
      } catch (err) {
        document.getElementById("output").innerText = "Error al cargar archivo";
      }
    }
  </script>

</body>
</html>
